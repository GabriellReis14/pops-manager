name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Guard against third-party files
        shell: bash
        run: |
          # POPStarter/Sony binaries, games and disc images must never be committed
          bad=$(git ls-files | grep -i -E '\.(pak|elf|vcd|bin|cue|iso|img|irx|tm2|xdelta|ppf|7z|zip|exe|dll)$|^POPS/|^POPSTARTER/|^resources/' || true)
          if [ -n "$bad" ]; then echo "Forbidden files in the repository:"; echo "$bad"; exit 1; fi
