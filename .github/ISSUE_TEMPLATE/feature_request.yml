name: Feature request / Sugestão
description: Suggest an improvement / Sugira uma melhoria
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like? / O que você gostaria?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful? / Por que é útil?
